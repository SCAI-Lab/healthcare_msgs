name: Lint Workflow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      # Set up Node.js and run npm lint (for JavaScript/TypeScript)
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: |
          if [ -f package.json ]; then
            npm install
            npm run lint    # Run lint for JavaScript/TypeScript only if package.json exists
          else
            echo "No JavaScript files or package.json found, skipping npm lint."
          fi

      # Set up Python and run pylint (for Python)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install pylint
      - name: Lint Python files (if any)
        run: |
          if [ $(find . -name "*.py" | wc -l) -gt 0 ]; then
            find . -name "*.py" | xargs pylint
          else
            echo "No Python files found, skipping pylint."
          fi

      # Set up C++ and run clang-tidy (for C++)
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy
      - name: Lint C++ files (if any)
        run: |
          if [ $(find . -name "*.cpp" | wc -l) -gt 0 ]; then
            find . -name "*.cpp" | xargs clang-tidy --checks=* --quiet
          else
            echo "No C++ files found, skipping clang-tidy."
          fi

      # Set up JSON linting (if any JSON files are found)
      - name: Install jq (for JSON lint)
        run: sudo apt-get install -y jq
      - name: Lint JSON files (if any)
        run: |
          if [ $(find . -name "*.json" | wc -l) -gt 0 ]; then
            find . -name "*.json" -exec jq empty {} \;
          else
            echo "No JSON files found, skipping JSON lint."
          fi

      # Set up Java linting (if any Java files are found)
      - name: Install checkstyle
        run: sudo apt-get install -y checkstyle
      - name: Lint Java files (if any)
        run: |
          if [ $(find . -name "*.java" | wc -l) -gt 0 ]; then
            # Download Google style config if not exists
            if [ ! -f google_checks.xml ]; then
              curl -sSL -o google_checks.xml https://raw.githubusercontent.com/checkstyle/checkstyle/master/src/main/resources/google_checks.xml
            fi
            find . -name "*.java" | xargs checkstyle -c google_checks.xml
          else
            echo "No Java files found, skipping checkstyle."
          fi

      # Set up YAML linting (if any YAML files are found)
      - name: Install yamllint
        run: sudo apt-get install -y yamllint
      - name: Lint YAML files (if any)
        run: |
          yaml_files=$(find . -name "*.yaml" -or -name "*.yml")
          if [ -n "$yaml_files" ]; then
            echo "$yaml_files" | xargs yamllint
          else
            echo "No YAML files found, skipping yamllint."
          fi

      # Set up ROS 2 Humble for .msg linting
      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.4
        with:
          distribution: humble

      - name: Lint ROS .msg files
        run: |
          if [ -d msg ]; then
            for f in $(find msg/ -name '*.msg'); do
              rosmsg show "$f" || exit 1
            done
          else
            echo "No msg directory found, skipping ROS msg lint."
          fi
